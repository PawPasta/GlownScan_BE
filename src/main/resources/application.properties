spring.application.name=GlowScan_BE

#FRONTEND LINK FOR AUTHEN
app.links.frontend=${GLOWSCAN_FRONTEND_DOMAIN}

# Load local secrets from the project working directory.
# Deployment environment variables can override these values.
spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=jdbc:postgresql://${GLOWSCAN_DATABASE_HOST}:${GLOWSCAN_DATABASE_PORT:5432}/${GLOWSCAN_DATABASE_NAME}?sslmode=${GLOWSCAN_DATABASE_SSL_MODE:require}&channelBinding=${GLOWSCAN_DATABASE_CHANNEL_BINDING:require}
spring.datasource.username=${GLOWSCAN_DATABASE_USERNAME}
spring.datasource.password=${GLOWSCAN_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway migrates the database before Hibernate validates the entity mappings.
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=app_auth
spring.flyway.schemas=app_auth,app_profile,app_cloudinary,app_skin_analysis
spring.flyway.create-schemas=true
# Existing installations created before Flyway are treated as the auth-schema baseline.
spring.flyway.baseline-on-migrate=${GLOWSCAN_FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.baseline-version=${GLOWSCAN_FLYWAY_BASELINE_VERSION}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app_auth

# Verify Token Timestamp
app.tokens.verify-email-ttl=${GLOWSCAN_AUTH_VERIFY_EMAIL_TOKEN_TTL}
app.tokens.reset-password-ttl=${GLOWSCAN_AUTH_RESET_PASSWORD_TOKEN_TTL}
app.tokens.refresh-token-ttl=${GLOWSCAN_AUTH_REFRESH_TOKEN_TTL}

#SENDING EMAIL CONFIG
spring.mail.host=${GLOWSCAN_MAIL_HOST}
spring.mail.port=${GLOWSCAN_MAIL_PORT}
spring.mail.username=${GLOWSCAN_MAIL_USERNAME}
spring.mail.password=${GLOWSCAN_MAIL_PASSWORD}
spring.mail.default-encoding=${GLOWSCAN_MAIL_DEFAULT_ENCODING}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${GLOWSCAN_MAIL_SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${GLOWSCAN_MAIL_SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${GLOWSCAN_MAIL_SMTP_TIMEOUT}

app.mail.from=${GLOWSCAN_MAIL_USERNAME}
app.mail.action-template=${GLOWSCAN_MAIL_ACTION_TEMPLATE}
app.mail.footer.notes=${GLOWSCAN_MAIL_FOOTER_NOTES}
app.mail.links.verify=${GLOWSCAN_FRONTEND_DOMAIN}${GLOWSCAN_AUTH_VERIFY_EMAIL_URL}
app.mail.links.resetpsw=${GLOWSCAN_FRONTEND_DOMAIN}${GLOWSCAN_AUTH_RESET_PASSWORD_URL}

# CORS
app.cors.allowed-origins=${GLOWSCAN_FRONTEND_DOMAIN}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha


# JWT Config
app.jwt.secret=${GLOWSCAN_JWT_SECRET}
app.jwt.issuer=${GLOWSCAN_JWT_ISSUER}
app.jwt.audience=${GLOWSCAN_JWT_AUDIENCE}
app.jwt.access-token-ttl=${GLOWSCAN_JWT_ACCESS_TOKEN_TTL}

#App Login
app.max.failed.login=${GLOWSCAN_LOGIN_MAX_FAILED_ATTEMPTS}
app.login.lock=${GLOWSCAN_LOGIN_LOCK_DURATION}

# Cloudinary direct signed upload. The API secret stays on the backend.
app.cloudinary.cloud-name=${GLOWSCAN_CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${GLOWSCAN_CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${GLOWSCAN_CLOUDINARY_API_SECRET}
app.cloudinary.avatar.folder=${GLOWSCAN_CLOUDINARY_AVATAR_FOLDER}
app.cloudinary.avatar.allowed-formats=${GLOWSCAN_CLOUDINARY_AVATAR_ALLOWED_FORMATS}
app.cloudinary.avatar.max-bytes=${GLOWSCAN_CLOUDINARY_AVATAR_MAX_BYTES}
app.cloudinary.avatar.max-dimension=${GLOWSCAN_CLOUDINARY_AVATAR_MAX_DIMENSION}
app.cloudinary.avatar.upload-intent-ttl=${GLOWSCAN_CLOUDINARY_AVATAR_UPLOAD_INTENT_TTL}
app.cloudinary.analysis.folder=${GLOWSCAN_CLOUDINARY_ANALYSIS_FOLDER:glowscan/skin-analysis}
app.cloudinary.analysis.allowed-formats=${GLOWSCAN_CLOUDINARY_ANALYSIS_ALLOWED_FORMATS:jpg,jpeg,png,webp}
app.cloudinary.analysis.max-bytes=${GLOWSCAN_CLOUDINARY_ANALYSIS_MAX_BYTES:5242880}
app.cloudinary.analysis.max-dimension=${GLOWSCAN_CLOUDINARY_ANALYSIS_MAX_DIMENSION:2048}
app.cloudinary.analysis.upload-intent-ttl=${GLOWSCAN_CLOUDINARY_ANALYSIS_UPLOAD_INTENT_TTL:5m}


# Gemini skin analysis. The key stays on the backend only.
app.gemini.api-key=${GLOWSCAN_GEMINI_API_KEY}
app.gemini.model=${GLOWSCAN_GEMINI_MODEL}
app.gemini.timeout=${GLOWSCAN_GEMINI_TIMEOUT}
app.gemini.base-url=${GLOWSCAN_GEMINI_BASE_URL:${GLOWNSCAN_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}}
# Database outbox worker for asynchronous Gemini requests.
app.skin-analysis.worker.fixed-delay=${GLOWSCAN_SKIN_ANALYSIS_WORKER_FIXED_DELAY}
app.skin-analysis.worker.batch-size=${GLOWSCAN_SKIN_ANALYSIS_WORKER_BATCH_SIZE}
