spring.application.name=GlowScan_BE

# Load the local .env from the project working directory.
# Deployment environment variables can override these values.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}&channelBinding=${DB_CHANNEL_BINDING:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Install database/database.portgre.sql first; Hibernate only validates the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app_auth

# Verify Token Timestamp
app.tokens.verify-email-ttl=${VERIFY_EMAIL_TOKEN_TTL:4h}

#SENDING EMAIL CONFIG
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME}
#FRONTEND LINK FOR AUTHEN
app.links.frontend=${FRONTEND_DOMAIN}
app.links.verify-email=${FRONTEND_DOMAIN}${VERIFY_EMAIL_URL}
app.links.reset-password=${FRONTEND_DOMAIN}${RESET_PASSWORD_URL}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
