spring.application.name=GlowScan_BE

# Load the local .env from the project working directory.
# Deployment environment variables can override these values.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}&channelBinding=${DB_CHANNEL_BINDING:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Install database/database.portgre.sql first; Hibernate only validates the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app_auth
