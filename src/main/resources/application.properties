spring.application.name=GlowScan_BE

#FRONTEND LINK FOR AUTHEN
app.links.frontend=${FRONTEND_DOMAIN}

# Load the local .env from the project working directory.
# Deployment environment variables can override these values.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}&channelBinding=${DB_CHANNEL_BINDING:require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway migrates the database before Hibernate validates the entity mappings.
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=app_auth
spring.flyway.schemas=app_auth,app_profile
spring.flyway.create-schemas=true
# Existing installations created before Flyway are treated as the auth-schema baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=app_auth

# Verify Token Timestamp
app.tokens.verify-email-ttl=${VERIFY_EMAIL_TOKEN_TTL}
app.tokens.reset-password-ttl=${RESET_PASSWORD_TOKEN_TTL}
app.tokens.refresh-token-ttl=${REFRESH_TOKEN_TTL}

#SENDING EMAIL CONFIG
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=${MAIL_ENCONDING}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_TIMEOUT}

app.mail.from=${MAIL_USERNAME}
app.mail.action-template=${MAIL_ACTION_TEMPLATE}
app.mail.footer.notes=${MAIL_FOOTER_NOTES}
app.mail.links.verify=${FRONTEND_DOMAIN}${VERIFY_EMAIL_URL}
app.mail.links.resetpsw=${FRONTEND_DOMAIN}${RESET_PASSWORD_URL}

# CORS
app.cors.allowed-origins=${FRONTEND_DOMAIN}

# OpenAPI / Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha


# JWT Config
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.audience=${JWT_AUDIENCE}
app.jwt.access-token-ttl=${JWT_SECRET_TTL}

#App Login
app.max.failed.login=${MAX_FAILED_LOGIN_ATTEMPTS}
app.login.lock=${LOGIN_LOCK_DURATION}

# Cloudinary direct signed upload. The API secret stays on the backend.
app.cloudinary.name=${CLOUDINARY_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}

# CLOUDINARY_API_SERECT is supported temporarily for existing local .env files.
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.cloudinary.avatar.folder=${CLOUDINARY_AVATAR_FOLDER}
app.cloudinary.avatar.allowed-formats=${CLOUDINARY_AVATAR_ALLOWED_FORMATS}
app.cloudinary.avatar.max-bytes=${CLOUDINARY_AVATAR_MAX_BYTES}
app.cloudinary.avatar.max-dimension=${CLOUDINARY_AVATAR_MAX_DIMENSION}
app.cloudinary.avatar.upload-intent-ttl=${CLOUDINARY_AVATAR_UPLOAD_INTENT_TTL}
app.cloudinary.avatar.upload-preset=${CLOUDINARY_AVATAR_UPLOAD_PRESET}
